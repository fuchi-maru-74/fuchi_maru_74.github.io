<!DOCTYPE html>
<html lang="ja">

<head>

  <style>
    body {
      margin: 0;

      color: #333;

    }

    header {
      background: #5146c7;
      color: white;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    .game {
      background: white;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(60, 70, 120, 0.08);

    .game h2 {
      color: #5146c7;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 25px;
      border-radius: 999px;
      background: #5146c7;
      color: white;
      text-decoration: none;

    footer {

      padding: 30px;

      color: white;

<body>

  <header>

      <p>
